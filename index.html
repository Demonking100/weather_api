<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="contanier">
        <h3>Weather</h3>
        <input id="cityt" type="text" name="search" placeholder="Location">
        <button id="mybtn" class="btn">Search</button>
    </div>
    <div id="result" class="result"></div>
    <div id="status" class="status"></div>

    <script>
        const input = document.getElementById('cityt')
        const btn = document.getElementById('mybtn')
        btn.addEventListener('click',()=>{
            getlocation();
        })
        async function getlocation() {
            const location = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${input.value}`)
            const data = await location.json();
            const longi = data.results[0].longitude;
            const lati = data.results[0].latitude;
            const display = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lati}&longitude=${longi}&current_weather=true`)
            const weatherData = await display.json();
            const status = document.getElementById('result')
            status.textContent = weatherData.current_weather.temperature;
            status.textContent = weatherData.current_weather.windspeed;
            console.log(weatherData)
        }
    </script>
</body>
</html>
